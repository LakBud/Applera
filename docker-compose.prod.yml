services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '5005:5005'
    env_file:
      - apps/server/.env.production
    command: pnpm start

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - '80:80'
    env_file:
      - apps/client/.env.production
