name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------- Node + pnpm ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.20.0 --activate

      # ---------- install ----------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ---------- lint ----------
      - name: Lint
        run: pnpm lint

      # ---------- typecheck (ROOT LEVEL ONLY RECOMMENDED) ----------
      - name: Typecheck
        run: pnpm typecheck

      # ---------- build ----------
      - name: Build Server
        run: pnpm --filter server build

      - name: Build Client
        run: pnpm --filter client build
