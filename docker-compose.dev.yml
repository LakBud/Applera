services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '5005:5005'
    env_file:
      - server/.env.development
    volumes:
      - ./server:/app/server
    command: pnpm dev

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '5173:80'
    env_file:
      - client/.env.development
    depends_on:
      - server
